# Herdr — persistent workspaces with the same soft-dark visual language as Ghostty.
onboarding = false

[theme]
name = "catppuccin"
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[server]
headless_cols = 160
headless_rows = 50

[ui]
window_title = "{workspace} · {hostname}"
