# Keep the standard Ctrl-b prefix. Ghostty supplies true color.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB'
set -g history-limit 100000
set -g escape-time 10
set -g focus-events on
set -g mouse on
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
bind -T copy-mode-vi v send-keys -X begin-selection
if-shell 'command -v pbcopy >/dev/null 2>&1' 'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy'
set -g status-style 'bg=#24283b,fg=#c0caf5'
set -g pane-border-style 'fg=#414868'
set -g pane-active-border-style 'fg=#7aa2f7'
set -g message-style 'bg=#414868,fg=#c0caf5'
setw -g window-status-current-style 'fg=#7aa2f7,bold'
set -g status-left '#[fg=#bb9af7] #S '
set -g status-right '#[fg=#7dcfff] %a %H:%M '
