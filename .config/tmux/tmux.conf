# Keep the standard Ctrl-b prefix. Ghostty supplies true color.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB'
set -g history-limit 100000
set -g escape-time 10
set -g focus-events on
set -g mouse on
set -g set-clipboard external
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind Tab last-window
bind -T copy-mode-vi v send-keys -X begin-selection
if-shell 'command -v pbcopy >/dev/null 2>&1' 'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy'
set -g status-style 'bg=#24283b,fg=#c0caf5'
set -g status-position top
set -g status-interval 5
set -g status-left-length 36
set -g status-right-length 60
set -g status-justify left
set -g pane-border-style 'fg=#414868'
set -g pane-active-border-style 'fg=#7aa2f7'
set -g message-style 'bg=#414868,fg=#c0caf5'
set -g pane-border-status top
set -g pane-border-format '#[fg=#565f89] #{pane_index} · #{pane_current_command} '
setw -g window-status-separator ' '
setw -g window-status-format '#[fg=#565f89] #I #[fg=#a9b1d6]#W '
setw -g window-status-current-format '#[bg=#3b4261,fg=#7aa2f7,bold] #I #W #[default]'
set -g status-left '#[bg=#7aa2f7,fg=#1f2335,bold] ◈ #S #[default]  '
set -g status-right '#{?client_prefix,#[bg=#e0af68,fg=#1f2335] PREFIX #[default] ,}#[fg=#565f89]#h  #[fg=#7dcfff]%a %d #[fg=#c0caf5]%H:%M '
