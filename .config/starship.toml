# Tokyo Night / Catppuccin-adjacent Starship prompt.
# Keep the signal high: location, git state, runtime, and the command result.

"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
command_timeout = 1000
scan_timeout = 30

format = """
[╭─](bold #7aa2f7)$os$username$hostname$directory$git_branch$git_status$status$jobs$python$nodejs$rust$golang$docker_context$fill$cmd_duration$time
[╰─](bold #7aa2f7)$character"""

[fill]
symbol = '·'
style = 'bold #3b4261'

[os]
disabled = false
style = 'bold #bb9af7'

[os.symbols]
Macos = ' '

[username]
show_always = true
format = '[$user]($style)'
style_user = 'bold #c0caf5'
style_root = 'bold #f7768e'

[hostname]
ssh_only = false
format = '[@$hostname ]($style)'
style = 'bold #565f89'

[directory]
format = '[ $path]($style)[$read_only]($read_only_style) '
style = 'bold #7aa2f7'
read_only = ' '
read_only_style = '#f7768e'
truncation_length = 3
truncate_to_repo = true
home_symbol = '~'

[git_branch]
symbol = ' '
format = '[$symbol$branch]($style) '
style = 'bold #bb9af7'

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = 'bold #f7768e'
conflicted = '='
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
stashed = '\$${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

[status]
disabled = false
format = '[$status]($style) '
style = 'bold #f7768e'
symbol = '✗ '

[jobs]
threshold = 1
format = '[$symbol$number]($style) '
symbol = '✦ '
style = 'bold #e0af68'

[python]
symbol = ' '
format = '[$symbol$pyenv_prefix$version( $virtualenv)]($style) '
style = '#e0af68'

[nodejs]
symbol = ' '
format = '[$symbol$version]($style) '
style = '#9ece6a'

[rust]
symbol = ' '
format = '[$symbol$version]($style) '
style = '#ff9e64'

[golang]
symbol = ' '
format = '[$symbol$version]($style) '
style = '#7dcfff'

[docker_context]
symbol = ' '
format = '[$symbol$context]($style) '
style = '#7dcfff'

[cmd_duration]
min_time = 2000
format = 'took [$duration]($style) '
style = 'bold #e0af68'

[time]
disabled = false
format = '[$time]($style)'
time_format = '%H:%M'
style = 'bold #565f89'

[character]
success_symbol = '[❯](bold #9ece6a)'
error_symbol = '[✗](bold #f7768e)'
vimcmd_symbol = '[❮](bold #bb9af7)'
