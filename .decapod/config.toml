schema_version = "1.0.0"

[init]
specs = true
ci = false
diagram_style = "ascii"
entrypoints = [
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    "CODEX.md",
]

[repo]
product_name = "dotfiles"
product_summary = "Reproducible M1 Max development workstation with themed native desktop, terminal/editor, Git, local AI and scoped reversible setup."
architecture_direction = "Python lifecycle tools, AppKit/QuartzCore dock, SketchyBar hover controls and shared themes, portable zsh/Cargo environment, pinned Neovim plugins, curated Brewfile and headless Podman workspaces."
product_type = "service_or_library"
done_criteria = "Scoped installation and safe restoration pass automated checks; local terminal and editor configuration work; changes are published to main."
base_branch = "main"
primary_languages = [
    "Lua",
    "Python",
    "Zsh",
    "python",
    "shell",
]
detected_surfaces = [
    "cli",
    "python",
    "shell",
]
external_tracker = false
container_workspaces = true
backend = "local"
declared_capabilities = [
    "external-integrations",
    "persistent-state",
]

[governance]
protected_paths = []
approval_categories = ["destructive_operations"]

[proof]
validation_buildkite_preflights = false

[proof.required_profile]
id = "repo.pr-readiness.v1"
reviewed_sources_digest = "sha256:db11cb16aef71e4fd6318fc989b8800a86aff3d7e3ebb3e98901c5cb56afccbc"

[proof.repository_contract]
reviewed_commands_digest = "sha256:acd8fe8534bb79464e6564ce832860acb1de5acb3de926ff9f6f7b92a32e89fa"
source_coverage = [
    { source = ".github/workflows/check.yml", commands = ["checks"] },
]

[proof.repository_contract.executions.checks]
program = "/usr/local/libexec/dotfiles-proof/python3"
directory = "."
timeout_seconds = 180

[proof.repository_contract.executions.checks.toolchain_files]
python3 = "/usr/local/libexec/dotfiles-proof/python3"
bash = "/usr/local/libexec/dotfiles-proof/bash"
zsh = "/usr/local/libexec/dotfiles-proof/zsh"
shellcheck = "/usr/local/libexec/dotfiles-proof/shellcheck"
git = "/usr/local/libexec/dotfiles-proof/git"
env = "/usr/local/libexec/dotfiles-proof/env"
dirname = "/usr/local/libexec/dotfiles-proof/dirname"
sh = "/usr/local/libexec/dotfiles-proof/sh"

[proof.repository_contract.executions.checks.environment]
PATH = "/usr/local/libexec/dotfiles-proof"
PYTHONDONTWRITEBYTECODE = "1"
LC_ALL = "C.UTF-8"

[[proof.commands]]
name = "checks"
command = "python3"
args = ["scripts/check.py"]
description = "ShellCheck, all zsh parsers, and portable installer/restore tests"
required = true

[custody]
isolation = "container"

[tracker]
provider = "decapod"

[context]
declared_sources = []

[decision]
provider = "none"
